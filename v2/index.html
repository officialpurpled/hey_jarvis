  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
    content="Text based Hey Jarvis  v2.0, its the advance and optimized version of the voice based Hey Jarvis v1">

        <div class="img-holder">
          <img src="image/jarvis_ai_bk.jpg" class="p-avatar" alt="avater">
        </div>
        <div class="title">
          <h2>Chat with Jarvis AI</h2>
          <p class="status">Offline</p>
        </div>
      </div>
      <div class="switch hicon" onclick="window.location= '../'">
        <span data-lucide="audio-lines"></span>
      </div>
    </header>

    <!-- chat message and form field -->
    <main>
      <p id="toast"></p>
      <!-- chat message box -->
      <div class="chat-UI" id="chat-UI">
        <div class="startMsg">
          Start of new chat with Jarvis
          <span class="start" data-lucide="message-square-dashed"></span>
        </div>

      </div>

      <!--input field-->
      <div class="formWrap">
        <form>
          <button class="addFileBtn" id="addFileBtn">
            <i data-lucide="plus" class="lucideAdd"></i>
          </button>
          <textarea name="prompt-field" id="prompt-field" placeholder="Enter your prompt here..."></textarea>
          <button id="sendBtn" class="sendBtn">
            <i data-lucide="mail" class="lucideSend"></i>
          </button>
        </form>

        <!-- Bottom -->
        <div class="nav">
          <p>
            Jarvis AI can make mistakes. Check important info.
          </p>
        </div>
      </div>
    </main>

  </div>
  <script src="./script/lib/lucide.js"></script>
