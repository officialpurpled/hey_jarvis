<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Text based Hey Jarvis  v2.0, its the advance and optimized version of the voice based Hey Jarvis v1.0">
  <meta name="author" content="Purple Dragon Official">
  <meta name="developer" content="Purple Dragon Official">
  <title>Hey Jarvis 2.0</title>
  <link rel="stylesheet" href="css/jarvis_beauty.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.css">
</head>
<body>
  <div class="app">
    <!-- the header sec -->
    <header>
      <div 
        id="notisBtn" 
        class="nav-back hicon"
      >
        <span data-lucide="bell-off"></span>
      </div>
      <div class="profile">
        <div class="img-holder">
          <img src="image/me-img.jpg" class="p-avatar" alt="avater">
        </div>
        <div class="title">
          <h2>Chat with Jarvis AI</h2> 
          <p class="status">Inactive</p>
        </div>
      </div>
      <div class="switch hicon" onclick="window.location= '../'">
        <!-- <img src="image/icons/menu-nav.svg" class="icons" alt=""> -->
         <span data-lucide="audio-lines"></span>
      </div>
    </header>

    <!-- chat message and form field -->
    <main>
      <p id="toast"></p>
      <!-- chat message box -->
      <div class="chat-UI" id="chat-UI"> 
        <div class="system">
          Start of new chat with Jarvis 
          <span data-lucide="message-square-dashed"></span> 
        </div>

        <!-- Message Example
         ‹div id="me"›
‹div class="message">
‹div class="head">
<b>You</b>
‹i class="time"›4:25pm</і>
</div>
‹div class="body">
Hello jarvis
</div>
</div>
‹div class="c-avatar-holder">
‹img src="image/me-img.jpg" alt="icons"/>
</div>
</div>
        -->
  
      </div>
      
      <!--input field-->
      <form>
        <button 
          class="addFileBtn"
          id="addFileBtn"
        >
          <i data-lucide="plus"></i>
        </button>
        <textarea 
          name="prompt-field"
          id="prompt-field"
          placeholder="Enter your prompt here..."
        ></textarea>
        <button id="sendBtn" class="sendBtn">
          <i data-lucide="send"></i>
        </button>
      </form>

      <!-- Bottom -->
      <div class="nav">
        <p>
          Always crosscheck AI response. as its liable to make mistake 
        </p>
      </div>
    </main>
  

  </div>
  <script src="./script/lib/lucide.js"></script>
  <script src="./script/lib/purify.min.js"></script>
  <script src="./script/lib/marked.min.js"></script>
  <script type="module" src="script/jarvis_engine_v2.js"></script>
</body>
</html>
